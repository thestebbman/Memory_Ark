<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Form</title>
</head>
<body>
    <h1>Save Submission as Text File</h1>
    <form id="submissionForm">
        <textarea id="textInput" rows="4" cols="50" placeholder="Type your text here..."></textarea><br>
        <button type="button" onclick="saveTextAsFile()">Save as Text File</button>
    </form>

    <script>
        function saveTextAsFile() {
            const textInput = document.getElementById('textInput').value;
            const blob = new Blob([textInput], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'submission.txt';
            link.click();
        }
    </script>
</body>
</html>
